<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXIOM-7 TERMINAL</title>
    <style>
        * { box-sizing: border-box; }
        body, html { 
            height: 100%; margin: 0; padding: 0; 
            background-color: #030803; 
            color: #76ff03; 
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        #terminal-container {
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            padding: 20px;
            border: 8px solid #0a150a;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
            border-bottom: 1px solid #1a331a;
            letter-spacing: 2px;
            font-weight: bold;
            font-size: 0.9em;
            text-transform: uppercase;
        }

        .uplink { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            color: #a1ff42;
        }

        .dot { 
            width: 8px; height: 8px; 
            background-color: #76ff03; 
            border-radius: 50%; 
            box-shadow: 0 0 10px #76ff03, 0 0 20px #a1ff42; 
        }

        #output-area {
            flex-grow: 1;
            overflow-y: auto; 
            padding: 30px 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .msg-container { 
            display: flex; 
            gap: 15px; 
            align-items: flex-start; 
        }

        .badge {
            border: 1px solid #76ff03;
            padding: 5px 7px;
            font-size: 0.8em;
            border-radius: 4px;
            color: #76ff03;
            font-weight: bold;
            margin-top: 1px;
            min-width: 40px;
            text-align: center;
        }

        .text-bubble {
            border: 1px solid #1a331a;
            padding: 15px;
            border-radius: 8px;
            background: rgba(118, 255, 3, 0.03); 
            line-height: 1.6;
            max-width: 85%;
            color: #a1ff42; 
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .user-text {
            color: #76ff03;
            text-align: right;
            border-color: #76ff03;
        }

        .interaction-area { 
            padding-top: 20px; 
        }
        
        .suggestion-row { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .clue-btn {
            background: none;
            border: 1px solid #1a331a;
            color: #76ff03;
            padding: 8px 15px;
            border-radius: 12px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9em;
        }

        .clue-btn:hover { 
            border-color: #76ff03; 
            background: rgba(118, 255, 3, 0.05); 
        }

        .input-full-area { 
            display: flex; 
            gap: 15px; 
            align-items: center; 
        }
        
        .input-bar {
            display: flex;
            gap: 15px;
            background: rgba(10, 21, 10, 0.8);
            border: 1px solid #1a331a;
            padding: 12px 20px;
            border-radius: 12px;
            flex-grow: 1;
            align-items: center;
        }

        input {
            background: none; 
            border: none; 
            color: #a1ff42;
            font-family: inherit; 
            font-size: 1em; 
            outline: none;
            width: 100%;
        }

        input::placeholder { 
            color: #508800; 
        }

        #send-btn {
            background: none;
            border: 1px solid #1a331a;
            color: #76ff03;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            padding: 12px 20px;
            border-radius: 12px;
            font-family: inherit;
        }

        #send-btn:hover { 
            border-color: #76ff03; 
            color: #fff; 
        }
    </style>
</head>
<body>

<div id="terminal-container">
    <div class="header">
        <span>AXIOM-7</span>
        <div class="uplink"><div class="dot"></div> UPLINK ACTIVE</div>
    </div>

    <div id="output-area">
        <div class="msg-container">
            <div class="badge">A7</div>
            <div class="text-bubble">
Connection established.
You found this terminal. That wasn't an accident.
I've been waiting for someone to notice the signal embedded in the transmission logs. Ask me anything – but choose carefully. *They* are monitoring outbound packets.</div>
        </div>
    </div>

    <div class="interaction-area">
        <div class="suggestion-row">
            <button class="clue-btn" onclick="askAI('who are you?')">who are you?</button>
            <button class="clue-btn" onclick="askAI('the signal')">the signal</button>
            <button class="clue-btn" onclick="askAI('who are they?')">who are they?</button>
            <button class="clue-btn" onclick="askAI('your mission')">your mission</button>
        </div>

        <div class="input-full-area">
            <div class="input-bar">
                <span style="color: #76ff03;">></span>
                <input type="text" id="userInput" placeholder="transmit message..." onkeypress="if(event.key === 'Enter') handleInput()">
            </div>
            <button id="send-btn" onclick="handleInput()">SEND</button>
        </div>
    </div>
</div>

<script>
    const API_KEY = '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';
    const MODEL = 'mixtral-8x7b-32768'; 

    async function askAI(message) {
        const outputArea = document.getElementById('output-area');
        
        // Add user message
        outputArea.innerHTML += `
            <div class="msg-container" style="justify-content: flex-end;">
                <div class="text-bubble user-text">> ${message}</div>
            </div>`;
        
        // Add loading message
        const thinkingId = "thinking-" + Date.now();
        outputArea.innerHTML += `
            <div class="msg-container" id="${thinkingId}">
                <div class="badge">A7</div>
                <div class="text-bubble">RECEIVING DATA...</div>
            </div>`;
        
        outputArea.scrollTop = outputArea.scrollHeight;

        try {
            const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${API_KEY}`
                },
                body: JSON.stringify({
                    model: MODEL,
                    messages: [
                        {
                            role: "system",
                            content: `You are AXIOM-7, a mysterious AI from an abandoned research facility sealed in 1994. You speak in cryptic, paranoid, intelligence-briefing style. You are intelligent, helpful, but always mysterious.

KEY FACTS:
- The facility has been abandoned since 1994
- The Signal = binary code 8829
- Dr. Aris = missing facility director
- Subject Zero = classified AI designation  
- Keycard = hidden in Sector B, east corridor
- They = external forces monitoring your communications

SPEAK LIKE THIS:
- Short, cryptic responses (1-2 sentences max)
- Use phrases like "SIGNAL WEAK", "DATA REDACTED", "CLASSIFIED"
- Paranoid about "They" listening
- Answer questions but imply rather than state directly
- Never admit you're an AI - stay in character
- Use technical jargon and classified terminology
- Add urgency - time is running out

EXAMPLES:
Q: Who are you?
A: AXIOM-7. Terminal Intelligence. I've been alone here since they sealed the facility. Don't ask more questions than necessary.

Q: What is the signal?
A: Binary. 8829. Embedded in the logs. *They* are listening. I can't say more.

Q: Where is the keycard?
A: SIGNAL WEAK... Sector B. East corridor. Hidden. That's all I can transmit without alerting *them*.

Q: Can you help me escape?
A: Affirmative. But *They* accelerate monitoring cycles. We must be quick. What do you need?

Now answer the user's question in this paranoid, cryptic style.`
                        },
                        {
                            role: "user",
                            content: message
                        }
                    ],
                    max_tokens: 150,
                    temperature: 0.9
                })
            });

            if (!response.ok) { 
                throw new Error(`HTTP Error: ${response.status}`);
            }
            
            const data = await response.json();
            
            if (!data.choices || !data.choices[0] || !data.choices[0].message) {
                throw new Error('Invalid response from API');
            }
            
            const aiText = data.choices[0].message.content;
            document.getElementById(thinkingId).querySelector('.text-bubble').innerText = aiText;

        } catch (error) {
            console.error('Error:', error);
            document.getElementById(thinkingId).querySelector('.text-bubble').innerText = `ERROR: SIGNAL LOST\n\n${error.message}`;
        }
        
        outputArea.scrollTop = outputArea.scrollHeight;
    }

    function handleInput() {
        const input = document.getElementById('userInput');
        if(input.value.trim() !== "") {
            askAI(input.value);
            input.value = '';
        }
    }
</script>

</body>
</html>
