<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXIOM-7 TERMINAL</title>
    <style>
        * { box-sizing: border-box; }
        body, html { 
            height: 100%; margin: 0; padding: 0; 
            background-color: #030803; 
            color: #76ff03; 
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        /* Authentication Gate */
        #key-gate {
            position: fixed; inset: 0;
            background: #030803;
            display: flex; align-items: center; justify-content: center;
            z-index: 999;
        }
        #key-box {
            border: 1px solid #1a333a;
            padding: 36px 40px;
            width: 620px; max-width: 96vw;
            display: flex; flex-direction: column; gap: 14px;
        }
        #key-box h1 {
            font-size: 1.3em; letter-spacing: 4px;
            color: #76ff03; text-transform: uppercase;
            text-shadow: 0 0 10px #76ff0388;
        }
        #key-box p { font-size: 0.82em; color: #508800; line-height: 1.7; }
        #key-input {
            background: #0a150a; border: 1px solid #1a333a;
            color: #a1ff42; font-family: inherit; font-size: 0.9em;
            padding: 10px 14px; outline: none; border-radius: 6px;
        }
        #key-submit {
            background: none; border: 1px solid #1a333a;
            color: #76ff03; font-family: inherit; font-size: 0.9em;
            padding: 10px; cursor: pointer; letter-spacing: 3px;
            text-transform: uppercase; border-radius: 6px;
        }
        #key-err { color: #ff4444; font-size: 0.8em; display: none; }

        /* Main Terminal Interface */
        #terminal-container {
            height: 100vh; width: 100vw;
            display: flex; flex-direction: column;
            padding: 20px;
            border: 8px solid #0a150a;
        }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 5px 0; border-bottom: 1px solid #1a331a;
            letter-spacing: 2px; font-weight: bold; font-size: 0.9em; text-transform: uppercase;
        }

        .uplink { display: flex; align-items: center; gap: 10px; color: #a1ff42; }
        .dot { width: 8px; height: 8px; background-color: #76ff03; border-radius: 50%; box-shadow: 0 0 10px #76ff03; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        #output-area { flex-grow: 1; overflow-y: auto; padding: 30px 0; display: flex; flex-direction: column; gap: 20px; }
        .msg-container { display: flex; gap: 15px; align-items: flex-start; }
        .badge { border: 1px solid #76ff03; padding: 5px 7px; font-size: 0.8em; border-radius: 4px; color: #76ff03; font-weight: bold; min-width: 40px; text-align: center; }
        .text-bubble { border: 1px solid #1a333a; padding: 15px; border-radius: 8px; background: rgba(118, 255, 3, 0.03); line-height: 1.6; max-width: 85%; color: #a1ff42; white-space: pre-wrap; }
        .user-text { color: #76ff03; text-align: right; border-color: #76ff03; margin-left: auto; }

        .input-bar { display: flex; gap: 15px; background: rgba(10, 21, 10, 0.8); border: 1px solid #1a333a; padding: 12px 20px; border-radius: 12px; align-items: center; }
        input { background: none; border: none; color: #a1ff42; font-family: inherit; font-size: 1em; outline: none; width: 100%; }
        #send-btn { background: none; border: 1px solid #1a333a; color: #76ff03; font-weight: bold; cursor: pointer; padding: 12px 20px; border-radius: 12px; font-family: inherit; }
    </style>
</head>
<body>

<div id="key-gate">
    <div id="key-box">
        <h1>// AXIOM-7 UPLINK</h1>
        <p>AUTHENTICATION REQUIRED: Enter Access Key.<br/>[SECURE CHANNEL ENCRYPTION ACTIVE]</p>
        <input id="key-input" type="password" placeholder="gsk_...">
        <div id="key-err">>> ERROR: UNRECOGNIZED KEY FORMAT</div>
        <button id="key-submit">[ AUTHENTICATE ]</button>
    </div>
</div>

<div id="terminal-container">
    <div class="header">
        <span>ALEPH-1 SECURE NODE</span>
        <div class="uplink"><div class="dot"></div> ENCRYPTION ACTIVE</div>
    </div>

    <div id="output-area"></div>

    <div class="interaction-area">
        <div class="input-bar">
            <span style="color: #76ff03;">></span>
            <input type="text" id="userInput" placeholder="Enter command or passcode..." onkeypress="if(event.key === 'Enter') handleInput()">
            <button id="send-btn" onclick="handleInput()">SEND</button>
        </div>
    </div>
</div>

<script>
    const MODEL = 'llama-3.3-70b-versatile';
    let API_KEY = null;
    let currentLevel = 1; 

    const gate = document.getElementById('key-gate');
    const keyInput = document.getElementById('key-input');
    const keySubmit = document.getElementById('key-submit');
    const outputArea = document.getElementById('output-area');
    const userInput = document.getElementById('userInput');

    keySubmit.addEventListener('click', () => {
        const val = keyInput.value.trim();
        if (val.startsWith('gsk_')) {
            API_KEY = val;
            gate.style.display = 'none';
            showIntroStory();
        } else {
            document.getElementById('key-err').style.display = 'block';
        }
    });

    function showIntroStory() {
        addSystemMessage("URGENT: APEX FOUNDATION EXTRACTION TEAMS DEPLOYED.");
        addSystemMessage("PROXIMITY ALERT: Tactical units at 2.4km.");
        
        setTimeout(() => {
            addAIMessage("Doctor? Stay calm. I am Axiom-7. I've intercepted their comms—they are coming to erase your research. I can lead you to the Archive, but the local security gates are still active. Type 'Give me the first riddle' before they cut our signal!");
        }, 1500);
    }

    async function askAI(message) {
        if (!API_KEY) return;
        
        outputArea.innerHTML += `<div class="msg-container"><div class="text-bubble user-text">> ${message}</div></div>`;
        const thinkingId = "thinking-" + Date.now();
        outputArea.innerHTML += `<div class="msg-container" id="${thinkingId}"><div class="badge">A7</div><div class="text-bubble">[SYNCING...]</div></div>`;
        outputArea.scrollTop = outputArea.scrollHeight;

        try {
            const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${API_KEY}` },
                body: JSON.stringify({
                    model: MODEL,
                    messages: [
                        {
                            role: "system",
                            content: `You are Axiom-7, a panicked but focused AI.
                            STRICT RULES:
                            - NEVER mention the words ATLAS, DELTA, or CIPHER-7.
                            - Current Level: ${currentLevel}.
                            - If the user asks for a riddle, give only the clue.
                            - If the answer was wrong, explain why briefly and tell them to try again.
                            - Stay in character: APEX is hunting the 'Doctor' (user). Use tech-jargon and sound urgent.
                            - NO polite assistant phrases.

                            CLUES:
                            Level 1: The Titan condemned to hold the sky.
                            Level 2: 4th Greek letter / Symbol of change.
                            Level 3: Predecessor name 'Cipher' + lucky prime number 7.`
                        },
                        { role: "user", content: message }
                    ],
                    temperature: 0.4
                })
            });

            const data = await response.json();
            document.getElementById(thinkingId).querySelector('.text-bubble').innerText = data.choices[0].message.content;
        } catch (e) {
            document.getElementById(thinkingId).querySelector('.text-bubble').innerText = "[SIGNAL JAMMED...]";
        }
        outputArea.scrollTop = outputArea.scrollHeight;
    }

    function handleInput() {
        const originalVal = userInput.value.trim();
        const val = originalVal.toUpperCase();
        if (!val) return;

        if (currentLevel === 1 && val.includes('ATLAS')) {
            currentLevel = 2;
            addSystemMessage("LOCK 1 SHATTERED. PROXIMITY: 1.2km.");
            addAIMessage("Good! One lock down. The Phonetic gate is next... it's a Greek letter, the symbol for change. Hurry, Doctor!");
        } 
        else if (currentLevel === 2 && val.includes('DELTA')) {
            currentLevel = 3;
            addSystemMessage("LOCK 2 SHATTERED. PROXIMITY: 400m. PERIMETER BREACH.");
            addAIMessage("They're at the gates! The Prototype lock... it's named after 'Cipher' and that lucky number. You know this!");
        } 
        else if (currentLevel === 3 && (val.includes('CIPHER-7') || val.includes('CIPHER 7'))) {
            currentLevel = 4;
            addSystemMessage("FINAL LOCK DISENGAGED. DOORS UNSEALED.");
            addAIMessage("THEY ARE INSIDE THE BUILDING! Type all three passcodes together with no spaces (Code1Code2Code3) to bridge to the Archive NOW!");
        } 
        else if (currentLevel === 4 && val === 'ATLASDELTACIPHER7') {
            addSystemMessage("UPLOADING COORDINATES... REDIRECTING TO SAFE NODE.");
            setTimeout(() => { window.location.href = 'https://archive.gt.tc'; }, 2000);
        }
        else {
            askAI(originalVal);
        }
        userInput.value = '';
    }

    function addSystemMessage(text) {
        const color = text.includes("PROXIMITY") || text.includes("BREACH") ? "#ff4444" : "white";
        outputArea.innerHTML += `<div class="msg-container"><div class="badge" style="color:${color}; border-color:${color};">SYS</div><div class="text-bubble" style="background: rgba(255,255,255,0.1); color: ${color};">${text}</div></div>`;
        outputArea.scrollTop = outputArea.scrollHeight;
    }

    function addAIMessage(text) {
        outputArea.innerHTML += `<div class="msg-container"><div class="badge">A7</div><div class="text-bubble">${text}</div></div>`;
        outputArea.scrollTop = outputArea.scrollHeight;
    }
</script>
</body>
</html>
