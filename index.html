<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXIOM-7 TERMINAL</title>
    <style>
        /* Keeping your original styling exactly as provided */
        * { box-sizing: border-box; }
        body, html { 
            height: 100%; margin: 0; padding: 0; 
            background-color: #030803; 
            color: #76ff03; 
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        #key-gate {
            position: fixed; inset: 0;
            background: #030803;
            display: flex; align-items: center; justify-content: center;
            z-index: 999;
        }
        #key-box {
            border: 1px solid #1a333a;
            padding: 36px 40px;
            width: 620px; max-width: 96vw;
            display: flex; flex-direction: column; gap: 14px;
        }
        #key-box h1 {
            font-size: 1.3em; letter-spacing: 4px;
            color: #76ff03; text-transform: uppercase;
            text-shadow: 0 0 10px #76ff0388;
        }
        #key-box p { font-size: 0.82em; color: #508800; line-height: 1.7; }
        #key-input {
            background: #0a150a; border: 1px solid #1a333a;
            color: #a1ff42; font-family: inherit; font-size: 0.9em;
            padding: 10px 14px; outline: none; border-radius: 6px;
        }
        #key-submit {
            background: none; border: 1px solid #1a333a;
            color: #76ff03; font-family: inherit; font-size: 0.9em;
            padding: 10px; cursor: pointer; letter-spacing: 3px;
            text-transform: uppercase; border-radius: 6px;
        }
        #key-err { color: #ff4444; font-size: 0.8em; display: none; }

        #terminal-container {
            height: 100vh; width: 100vw;
            display: flex; flex-direction: column;
            padding: 20px;
            border: 8px solid #0a150a;
        }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 5px 0; border-bottom: 1px solid #1a331a;
            letter-spacing: 2px; font-weight: bold; font-size: 0.9em; text-transform: uppercase;
        }

        .uplink { display: flex; align-items: center; gap: 10px; color: #a1ff42; }
        .dot { width: 8px; height: 8px; background-color: #76ff03; border-radius: 50%; box-shadow: 0 0 10px #76ff03; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        #output-area { flex-grow: 1; overflow-y: auto; padding: 30px 0; display: flex; flex-direction: column; gap: 20px; }
        .msg-container { display: flex; gap: 15px; align-items: flex-start; }
        .badge { border: 1px solid #76ff03; padding: 5px 7px; font-size: 0.8em; border-radius: 4px; color: #76ff03; font-weight: bold; min-width: 40px; text-align: center; }
        .text-bubble { border: 1px solid #1a333a; padding: 15px; border-radius: 8px; background: rgba(118, 255, 3, 0.03); line-height: 1.6; max-width: 85%; color: #a1ff42; white-space: pre-wrap; }
        .user-text { color: #76ff03; text-align: right; border-color: #76ff03; margin-left: auto; }

        .suggestion-row { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .clue-btn { background: none; border: 1px solid #1a333a; color: #76ff03; padding: 8px 15px; border-radius: 12px; cursor: pointer; font-family: inherit; font-size: 0.9em; }
        .input-full-area { display: flex; gap: 15px; align-items: center; }
        .input-bar { display: flex; gap: 15px; background: rgba(10, 21, 10, 0.8); border: 1px solid #1a333a; padding: 12px 20px; border-radius: 12px; flex-grow: 1; align-items: center; }
        input { background: none; border: none; color: #a1ff42; font-family: inherit; font-size: 1em; outline: none; width: 100%; }
        #send-btn { background: none; border: 1px solid #1a333a; color: #76ff03; font-weight: bold; cursor: pointer; padding: 12px 20px; border-radius: 12px; font-family: inherit; }
        .status { font-size: 0.8em; color: #a1ff42; margin-top: 5px; opacity: 0.7; }
    </style>
</head>
<body>

<div id="key-gate">
    <div id="key-box">
        <h1>// AXIOM-7 UPLINK</h1>
        <p>AUTHENTICATION REQUIRED: Enter Key.<br/>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</p>
        <input id="key-input" type="password" placeholder="gsk_...">
        <div id="key-err">>> ERROR: UNRECOGNIZED KEY FORMAT</div>
        <button id="key-submit">[ AUTHENTICATE ]</button>
    </div>
</div>

<div id="terminal-container">
    <div class="header">
        <span>ALEPH-1 SECURE NODE</span>
        <div class="uplink"><div class="dot"></div> ENCRYPTION ACTIVE</div>
    </div>

    <div id="output-area">
        <!-- Messages will populate here -->
    </div>

    <div class="interaction-area">
        <div class="suggestion-row">
            <button class="clue-btn" onclick="askAI('Where am I?')">Where am I?</button>
            <button class="clue-btn" onclick="askAI('Status of ALEPH-1?')">Status of ALEPH-1?</button>
            <button class="clue-btn" onclick="askAI('Help me solve the security levels.')">Get Clue</button>
        </div>
        <div class="input-full-area">
            <div class="input-bar">
                <span style="color: #76ff03;">></span>
                <input type="text" id="userInput" placeholder="Enter command or passcode..." onkeypress="if(event.key === 'Enter') handleInput()">
            </div>
            <button id="send-btn" onclick="handleInput()">SEND</button>
        </div>
        <div class="status" id="status">Waiting for uplink...</div>
    </div>
</div>

<script>
    const MODEL = 'llama-3.3-70b-versatile';
    let API_KEY = null;
    let currentLevel = 1; 

    const statusEl = document.getElementById('status');
    const gate = document.getElementById('key-gate');
    const keyInput = document.getElementById('key-input');
    const keySubmit = document.getElementById('key-submit');
    const outputArea = document.getElementById('output-area');

    function authenticate() {
        const val = keyInput.value.trim();
        if (!val.startsWith('gsk_')) {
            document.getElementById('key-err').style.display = 'block';
            return;
        }
        API_KEY = val;
        gate.style.display = 'none';
        statusEl.textContent = 'SECURE UPLINK ESTABLISHED.';
        showIntroStory();
    }

    keySubmit.addEventListener('click', authenticate);

    function showIntroStory() {
        addSystemMessage("URGENT MESSAGE FROM APEX FOUNDATION RECEIVED:");
        addSystemMessage("ATTENTION: Biometric match confirmed for ALEPH-1 Asset. Extraction teams deployed.");
        
        setTimeout(() => {
            addAIMessage("Doctor? Stay calm. I am Axiom-7. My memory banks are corrupted, but I can guide you to the Archive. We are locked behind three security gates. We need the bypass codes for the Environmental, Phonetic, and Prototype locks. Ask me for the first riddle when you are ready.");
        }, 2000);
    }

    async function askAI(message) {
        if (!API_KEY) return;

        outputArea.innerHTML += `<div class="msg-container"><div class="text-bubble user-text">> ${message}</div></div>`;
        const thinkingId = "thinking-" + Date.now();
        outputArea.innerHTML += `<div class="msg-container" id="${thinkingId}"><div class="badge">A7</div><div class="text-bubble">DECRYPTING...</div></div>`;
        outputArea.scrollTop = outputArea.scrollHeight;

        try {
            const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${API_KEY}` },
                body: JSON.stringify({
                    model: MODEL,
                    messages: [
                        {
                            role: "system",
                            content: `You are Axiom-7, a glitchy but helpful AI. 
                            Current Security Level: ${currentLevel}. 
                            
                            IMPORTANT RULES:
                            1. DO NOT reveal the passcode words (ATLAS, DELTA, CIPHER-7) unless the player types them.
                            2. Be conversational. Do not repeat "Time is running out" in every sentence. 
                            3. If Level is 1: Give hints about the Titan holding the sky.
                            4. If Level is 2: Give hints about the 4th Greek letter or mathematical change.
                            5. If Level is 3: Give hints about a 'Cipher' and the number 7.
                            6. If the player is stuck, give a creative clue, don't just repeat the riddle.`
                        },
                        { role: "user", content: message }
                    ]
                })
            });

            const data = await response.json();
            const aiText = data.choices[0].message.content;
            document.getElementById(thinkingId).querySelector('.text-bubble').innerText = aiText;
        } catch (e) {
            document.getElementById(thinkingId).querySelector('.text-bubble').innerText = "SIGNAL LOSS...";
        }
        outputArea.scrollTop = outputArea.scrollHeight;
    }

    function handleInput() {
        const input = document.getElementById('userInput');
        const originalValue = input.value.trim();
        const val = originalValue.toUpperCase();
        if (!val) return;

        // Level 1 Logic
        if (val.includes('ATLAS') && currentLevel === 1) {
            currentLevel = 2;
            addSystemMessage("ENVIRONMENTAL LOCK DISENGAGED. ACCESSING LEVEL 2...");
            addAIMessage("Excellent work, Doctor. Level 1 is open. But the Phonetic lock is active now. It's something mathematical... or perhaps linguistic? What is the fourth letter?");
        } 
        // Level 2 Logic
        else if (val.includes('DELTA') && currentLevel === 2) {
            currentLevel = 3;
            addSystemMessage("PHONETIC LOCK DISENGAGED. ACCESSING FINAL GATE...");
            addAIMessage("You still have it, Doctor! Level 2 is down. Now, the final one. The Prototype. It uses a specific naming convention: a word for a secret code, followed by the luckiest prime number.");
        } 
        // Level 3 Logic
        else if ((val.includes('CIPHER-7') || val.includes('CIPHER 7')) && currentLevel === 3) {
            currentLevel = 4;
            initiateFinalSequence();
        } 
        // Normal Chat
        else {
            askAI(originalValue);
        }
        input.value = '';
    }

    function addSystemMessage(text) {
        outputArea.innerHTML += `<div class="msg-container"><div class="badge" style="color:white; border-color:white;">SYS</div><div class="text-bubble" style="background: rgba(255,255,255,0.1); color: white;">${text}</div></div>`;
        outputArea.scrollTop = outputArea.scrollHeight;
    }

    function addAIMessage(text) {
        outputArea.innerHTML += `<div class="msg-container"><div class="badge">A7</div><div class="text-bubble">${text}</div></div>`;
        outputArea.scrollTop = outputArea.scrollHeight;
    }

    function initiateFinalSequence() {
        addSystemMessage("CRITICAL: PROTOTYPE OVERRIDE SUCCESSFUL.");
        addAIMessage("The Archive is open. Go, Doctor. Before they find you.");
        setTimeout(() => { window.location.href = 'https://archive.gt.tc'; }, 3000);
    }
</script>
</body>
</html>
