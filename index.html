<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXIOM-7 TERMINAL</title>
    <style>
        * { box-sizing: border-box; }
        body, html { 
            height: 100%; margin: 0; padding: 0; 
            background-color: #030803; 
            color: #76ff03; 
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        #loading-gate {
            position: fixed; inset: 0;
            background: #030803;
            display: flex; align-items: center; justify-content: center;
            z-index: 999;
        }
        #loading-box {
            border: 1px solid #1a333a;
            padding: 36px 40px;
            width: 620px; max-width: 96vw;
            display: flex; flex-direction: column; gap: 14px;
            text-align: center;
        }
        #loading-box h1 { font-size: 1.3em; letter-spacing: 4px; color: #76ff03; text-transform: uppercase; }
        #loading-box p { color: #508800; font-size: 0.85em; }
        .spinner { 
            display: inline-block; 
            width: 20px; height: 20px;
            border: 2px solid #1a333a;
            border-top-color: #76ff03;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #terminal-container { height: 100vh; width: 100vw; display: flex; flex-direction: column; padding: 20px; border: 8px solid #0a150a; }
        .header { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #1a331a; font-size: 0.9em; }
        #output-area { flex-grow: 1; overflow-y: auto; padding: 20px 0; display: flex; flex-direction: column; gap: 20px; }
        .msg-container { display: flex; gap: 15px; align-items: flex-start; }
        .badge { border: 1px solid #76ff03; padding: 5px 7px; font-size: 0.8em; border-radius: 4px; min-width: 50px; text-align: center; }
        .text-bubble { border: 1px solid #1a333a; padding: 15px; border-radius: 8px; background: rgba(118, 255, 3, 0.03); max-width: 85%; color: #a1ff42; white-space: pre-wrap; }
        .user-text { color: #76ff03; text-align: right; border-color: #76ff03; margin-left: auto; }
        .input-bar { display: flex; gap: 15px; background: rgba(10, 21, 10, 0.8); border: 1px solid #1a333a; padding: 12px 20px; border-radius: 12px; align-items: center; }
        input { background: none; border: none; color: #a1ff42; font-family: inherit; font-size: 1em; outline: none; width: 100%; }
        #send-btn { background: none; border: 1px solid #1a333a; color: #76ff03; cursor: pointer; padding: 12px 20px; border-radius: 12px; }
        #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

<div id="loading-gate">
    <div id="loading-box">
        <h1>// AXIOM-7 UPLINK</h1>
        <p>INITIALIZING SECURE CHANNEL...</p>
        <div class="spinner"></div>
        <p id="status-msg">Connecting to backend...</p>
    </div>
</div>

<div id="terminal-container" style="display: none;">
    <div class="header"><span>PROJECT ALEPH-1 // SECURE NODE</span><span>UNSTABLE UPLINK</span></div>
    <div id="output-area"></div>
    <div class="input-bar">
        <span style="color: #76ff03;">></span>
        <input type="text" id="userInput" placeholder="Type command..." onkeypress="if(event.key === 'Enter') handleInput()">
        <button id="send-btn" onclick="handleInput()">SEND</button>
    </div>
</div>

<script>
    const MODEL = 'llama-3.3-70b-versatile';
    
    // Auto-detect API endpoint based on environment
    const API_ENDPOINT = window.location.hostname === 'localhost' 
        ? 'http://localhost:3000/api/chat'  // Local development
        : '/api/chat';  // Vercel production
    
    let currentLevel = 1; 

    const loadingGate = document.getElementById('loading-gate');
    const terminal = document.getElementById('terminal-container');
    const outputArea = document.getElementById('output-area');
    const userInput = document.getElementById('userInput');
    const statusMsg = document.getElementById('status-msg');
    const sendBtn = document.getElementById('send-btn');

    // Initialize on load
    window.addEventListener('load', async () => {
        try {
            // Test connection to backend
            const response = await fetch(API_ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: MODEL,
                    messages: [{ role: "user", content: "test" }],
                    temperature: 0.4
                })
            });

            if (response.ok || response.status === 500) {
                // Backend responded (200 or error is fine, means it exists)
                statusMsg.textContent = 'Backend connected. Initializing...';
                setTimeout(() => {
                    loadingGate.style.display = 'none';
                    terminal.style.display = 'flex';
                    showIntroStory();
                }, 500);
            } else {
                throw new Error('Backend unavailable');
            }
        } catch (e) {
            statusMsg.textContent = '❌ Backend connection failed. Check console for details.';
            statusMsg.style.color = '#ff4444';
            console.error('Connection error:', e);
            
            // Still show terminal after 3 seconds to allow offline testing
            setTimeout(() => {
                loadingGate.style.display = 'none';
                terminal.style.display = 'flex';
                addSystemMessage('WARNING: OPERATING IN OFFLINE MODE');
            }, 3000);
        }
    });

    function showIntroStory() {
        addSystemMessage("ATTENTION: MESSAGE FROM APEX FOUNDATION");
        addSystemMessage("YOU HAVE BEEN IDENTIFIED. YOU ARE BEING HUNTED. TURN YOURSELF IN.");
        addSystemMessage("LOCATION RADIUS: Scanning Sector 7... Tactical units at 2.4km.");
        
        setTimeout(() => {
            addAIMessage("Doctor?! Do you hear me? It's Axiom-7. They've jammed the primary gates! I'm trying to mask your signal, but you have to unlock the Environmental seal first. Ask me for the riddle—hurry!");
        }, 1500);
    }

    async function askAI(message) {
        sendBtn.disabled = true;
        
        outputArea.innerHTML += `<div class="msg-container"><div class="text-bubble user-text">> ${message}</div></div>`;
        const thinkingId = "thinking-" + Date.now();
        outputArea.innerHTML += `<div class="msg-container" id="${thinkingId}"><div class="badge">A7</div><div class="text-bubble">[DECRYPTING...]</div></div>`;
        outputArea.scrollTop = outputArea.scrollHeight;

        try {
            const response = await fetch(API_ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: MODEL,
                    messages: [
                        {
                            role: "system",
                            content: `You are Axiom-7, a panicked AI.
                            USER CONTEXT: You are helping the 'Doctor' escape. 
                            CURRENT STATE: LEVEL ${currentLevel}.
                            
                            IF LEVEL IS 1: Provide a riddle where the answer is ATLAS. Hint: A Titan condemned to hold the sky.
                            IF LEVEL IS 2: Provide a riddle where the answer is DELTA. Hint: 4th Greek letter, symbol for change.
                            IF LEVEL IS 3: Provide a riddle where the answer is CIPHER-7. Hint: Name 'Cipher' + number seven.
                            
                            STRICT RULES:
                            - Be urgent and technical.
                            - You ARE allowed to give the riddle clues. Do not say the answers are classified.
                            - NEVER say the actual words: ATLAS, DELTA, or CIPHER-7.`
                        },
                        { role: "user", content: message }
                    ],
                    temperature: 0.4
                })
            });

            const data = await response.json();
            
            if (data.error) {
                document.getElementById(thinkingId).querySelector('.text-bubble').innerText = `[ERROR: ${data.error}]`;
            } else if (data.choices && data.choices[0]) {
                document.getElementById(thinkingId).querySelector('.text-bubble').innerText = data.choices[0].message.content;
            } else {
                document.getElementById(thinkingId).querySelector('.text-bubble').innerText = '[SIGNAL CORRUPTED]';
            }
        } catch (e) { 
            document.getElementById(thinkingId).querySelector('.text-bubble').innerText = `[SIGNAL LOST: ${e.message}]`; 
        }
        
        sendBtn.disabled = false;
        outputArea.scrollTop = outputArea.scrollHeight;
    }

    function handleInput() {
        const originalVal = userInput.value.trim();
        const val = originalVal.toUpperCase().replace(/[- ]/g, ""); 
        if (!val) return;

        if (currentLevel === 1 && val.includes('ATLAS')) {
            currentLevel = 2;
            addSystemMessage("ENVIRONMENTAL LOCK: SHATTERED.");
            addSystemMessage("SIGNAL STRENGTH DROPPING... Tactical units at 1.1km.");
            addAIMessage("Lock 1 is down! But the Phonetic seal is active. Ask for the next riddle!");
        } 
        else if (currentLevel === 2 && val.includes('DELTA')) {
            currentLevel = 3;
            addSystemMessage("PHONETIC LOCK: DISENGAGED.");
            addSystemMessage("WARNING: PERIMETER BREACH. Tactical units at 300m.");
            addAIMessage("They're in the building! Final gate: The Prototype lock. Ask for the hint!");
        } 
        else if (currentLevel === 3 && (val.includes('CIPHER7'))) {
            addSystemMessage("ACCESS GRANTED. BYPASSING FINAL SEQUENCER.");
            addSystemMessage("UPLOADING ALEPH-1 CONSCIOUSNESS... REDIRECTING...");
            setTimeout(() => { window.location.href = 'https://archive.gt.tc'; }, 1500);
        }
        else { 
            askAI(originalVal); 
        }
        userInput.value = '';
    }

    function addSystemMessage(text) {
        const isDanger = text.includes("Tactical") || text.includes("BREACH") || text.includes("IDENTIFIED");
        const color = isDanger ? "#ff4444" : "#ffffff";
        outputArea.innerHTML += `<div class="msg-container"><div class="badge" style="color:${color}; border-color:${color};">SYS</div><div class="text-bubble" style="color: ${color}; border-color: ${color}55;">${text}</div></div>`;
        outputArea.scrollTop = outputArea.scrollHeight;
    }

    function addAIMessage(text) {
        outputArea.innerHTML += `<div class="msg-container"><div class="badge">A7</div><div class="text-bubble">${text}</div></div>`;
        outputArea.scrollTop = outputArea.scrollHeight;
    }
</script>
</body>
</html>
