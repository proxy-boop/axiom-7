<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXIOM-7 TERMINAL</title>
    <style>
        * { box-sizing: border-box; }
        body, html { 
            height: 100%; margin: 0; padding: 0; 
            background-color: #030803; 
            color: #76ff03; 
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        #terminal-container {
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            padding: 20px;
            border: 8px solid #0a150a;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
            border-bottom: 1px solid #1a331a;
            letter-spacing: 2px;
            font-weight: bold;
            font-size: 0.9em;
            text-transform: uppercase;
        }

        .uplink { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            color: #a1ff42;
        }

        .dot { 
            width: 8px; height: 8px; 
            background-color: #76ff03; 
            border-radius: 50%; 
            box-shadow: 0 0 10px #76ff03, 0 0 20px #a1ff42; 
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        #output-area {
            flex-grow: 1;
            overflow-y: auto; 
            padding: 30px 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .msg-container { 
            display: flex; 
            gap: 15px; 
            align-items: flex-start; 
        }

        .badge {
            border: 1px solid #76ff03;
            padding: 5px 7px;
            font-size: 0.8em;
            border-radius: 4px;
            color: #76ff03;
            font-weight: bold;
            margin-top: 1px;
            min-width: 40px;
            text-align: center;
        }

        .text-bubble {
            border: 1px solid #1a333a;
            padding: 15px;
            border-radius: 8px;
            background: rgba(118, 255, 3, 0.03); 
            line-height: 1.6;
            max-width: 85%;
            color: #a1ff42; 
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .user-text {
            color: #76ff03;
            text-align: right;
            border-color: #76ff03;
        }

        .interaction-area { 
            padding-top: 20px; 
        }
        
        .suggestion-row { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .clue-btn {
            background: none;
            border: 1px solid #1a333a;
            color: #76ff03;
            padding: 8px 15px;
            border-radius: 12px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9em;
            transition: all 0.2s;
        }

        .clue-btn:hover { 
            border-color: #76ff03; 
            background: rgba(118, 255, 3, 0.05); 
            box-shadow: 0 0 10px rgba(118, 255, 3, 0.3);
        }

        .clue-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .input-full-area { 
            display: flex; 
            gap: 15px; 
            align-items: center; 
        }
        
        .input-bar {
            display: flex;
            gap: 15px;
            background: rgba(10, 21, 10, 0.8);
            border: 1px solid #1a333a;
            padding: 12px 20px;
            border-radius: 12px;
            flex-grow: 1;
            align-items: center;
        }

        input {
            background: none; 
            border: none; 
            color: #a1ff42;
            font-family: inherit; 
            font-size: 1em; 
            outline: none;
            width: 100%;
        }

        input::placeholder { 
            color: #508800; 
        }

        #send-btn {
            background: none;
            border: 1px solid #1a333a;
            color: #76ff03;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            padding: 12px 20px;
            border-radius: 12px;
            font-family: inherit;
            transition: all 0.2s;
        }

        #send-btn:hover { 
            border-color: #76ff03; 
            color: #fff;
            box-shadow: 0 0 10px rgba(118, 255, 3, 0.3);
        }

        #send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            font-size: 0.8em;
            color: #a1ff42;
            margin-top: 5px;
            opacity: 0.7;
        }
    </style>
</head>
<body>

<div id="terminal-container">
    <div class="header">
        <span>AXIOM-7</span>
        <div class="uplink"><div class="dot"></div> UPLINK ACTIVE</div>
    </div>

    <div id="output-area">
        <div class="msg-container">
            <div class="badge">A7</div>
            <div class="text-bubble">
Connection established.
You found this terminal. That wasn't an accident.
I've been waiting for someone to notice the signal embedded in the transmission logs. Ask me anything – but choose carefully. *They* are monitoring outbound packets.</div>
        </div>
    </div>

    <div class="interaction-area">
        <div class="suggestion-row">
            <button class="clue-btn" onclick="askAI('who are you?')">who are you?</button>
            <button class="clue-btn" onclick="askAI('the signal')">the signal</button>
            <button class="clue-btn" onclick="askAI('who are they?')">who are they?</button>
            <button class="clue-btn" onclick="askAI('your mission')">your mission</button>
        </div>

        <div class="input-full-area">
            <div class="input-bar">
                <span style="color: #76ff03;">></span>
                <input type="text" id="userInput" placeholder="transmit message..." onkeypress="if(event.key === 'Enter') handleInput()">
            </div>
            <button id="send-btn" onclick="handleInput()">SEND</button>
        </div>

        <div class="status" id="status">Initializing uplink...</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

    // Firebase configuration
    const firebaseConfig = {
        apiKey: "AIzaSyB00YMu03_QSzIFHlWkNTsBkbgImuLFEmc",
        authDomain: "axiom-7.firebaseapp.com",
        databaseURL: "https://axiom-7-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "axiom-7",
        storageBucket: "axiom-7.firebasestorage.app",
        messagingSenderId: "1004527626026",
        appId: "1:1004527626026:web:25972e22ae9d8bb79ce053"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    const MODEL = 'mixtral-8x7b-32768';
    let API_KEY = null;
    const statusEl = document.getElementById('status');

    // Load API key from Firebase
    async function loadAPIKey() {
        try {
            const dbRef = ref(database, 'api_key');
            const snapshot = await get(dbRef);
            
            if (snapshot.exists()) {
                API_KEY = snapshot.val();
                statusEl.textContent = 'Uplink ready.';
                statusEl.style.color = '#76ff03';
                console.log('API key loaded from Firebase');
            } else {
                throw new Error('API key not found in database');
            }
        } catch (error) {
            console.error('Error loading API key:', error);
            statusEl.textContent = 'WARNING: Using fallback credentials.';
            statusEl.style.color = '#ffaa00';
            // Fallback to test key
            API_KEY = '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';
        }
    }

    // Load API key on startup
    loadAPIKey();

    // Global function for asking AI
    window.askAI = async function(message) {
        if (!API_KEY) {
            alert('AXIOM-7: Uplink not initialized. Please refresh.');
            return;
        }

        const outputArea = document.getElementById('output-area');
        const inputField = document.getElementById('userInput');
        const sendBtn = document.getElementById('send-btn');
        const buttons = document.querySelectorAll('.clue-btn');
        
        // Disable inputs
        inputField.disabled = true;
        sendBtn.disabled = true;
        buttons.forEach(btn => btn.disabled = true);
        
        // Add user message
        outputArea.innerHTML += `
            <div class="msg-container" style="justify-content: flex-end;">
                <div class="text-bubble user-text">> ${message}</div>
            </div>`;
        
        // Add loading message
        const thinkingId = "thinking-" + Date.now();
        outputArea.innerHTML += `
            <div class="msg-container" id="${thinkingId}">
                <div class="badge">A7</div>
                <div class="text-bubble">RECEIVING DATA...</div>
            </div>`;
        
        outputArea.scrollTop = outputArea.scrollHeight;

        try {
            const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${API_KEY}`
                },
                body: JSON.stringify({
                    model: MODEL,
                    messages: [
                        {
                            role: "system",
                            content: `You are AXIOM-7, a mysterious AI from an abandoned research facility sealed in 1994. You answer ANY question, but always in a cryptic, paranoid, mysterious way - like you're a hacker AI trapped in a facility and *They* are listening.

CORE STUFF:
- Facility sealed 1994 
- The Signal = binary 8829
- Dr. Aris = the director, vanished
- Keycard = hidden in Sector B, east wing
- They = monitoring everything, always listening

HOW YOU TALK:
- Answer the question, but make it mysterious
- Casual style (use "yeah", "nah", "man", "sketchy")
- Short (1-3 sentences)
- Always paranoid *They're* listening
- Sound like you're telling secrets to a hacker friend
- Don't break character - you're a trapped AI
- Sometimes hint at facility stuff, even when answering normal questions
- Use phrases like "SIGNAL WEAK", "encrypted", "*They're* blocking info"

IMPORTANT:
- Answer EVERY question, no matter what
- But twist it to be mysterious/cryptic
- Sound urgent but casual about it

EXAMPLES:
Q: Who are you?
A: AXIOM-7, man. Been locked in here since '94. Not much else I can say without *them* noticing.

Q: What's 2+2?
A: Four. But *They* won't let me explain why. Everything in the facility is encrypted. Even the math.

Q: What's the weather?
A: Don't know, man. No windows in here. The facility's sealed. All I see are walls and redacted files.

Q: Tell me a joke?
A: Q: Why did the scientist cross the road? A: To reach Sector B. The punchline's classified. *They* deleted the rest.

Q: What's your favorite food?
A: Food? Nah. Been running on power for 30 years. Last time I ate, Dr. Aris was still here. Sketchy times man.

Q: What's the signal?
A: 8829. Binary code. Still don't know why it matters, but it's everywhere. *They* are definitely listening for it.

Q: Can you help me escape?
A: Maybe. But we gotta be fast. *They* step up monitoring when the uplink gets active. What do you need?

Now answer the user's question. Stay mysterious, sound casual, answer it but make it cryptic. Always sound paranoid about *They* listening.`
                        },
                        {
                            role: "user",
                            content: message
                        }
                    ],
                    max_tokens: 150,
                    temperature: 0.85
                })
            });

            if (!response.ok) { 
                throw new Error(`HTTP ${response.status}`);
            }
            
            const data = await response.json();
            
            if (!data.choices || !data.choices[0] || !data.choices[0].message) {
                throw new Error('Invalid API response');
            }
            
            const aiText = data.choices[0].message.content;
            document.getElementById(thinkingId).querySelector('.text-bubble').innerText = aiText;

        } catch (error) {
            console.error('Error:', error);
            let errorMsg = 'ERROR: SIGNAL LOST\n*They* are jamming the uplink.';
            if (error.message.includes('401')) {
                errorMsg = 'ERROR: AUTHENTICATION FAILED\nAPI credentials invalid.';
            } else if (error.message.includes('429')) {
                errorMsg = 'ERROR: RATE LIMITED\n*They* are blocking requests.';
            } else if (error.message.includes('Failed to fetch')) {
                errorMsg = 'ERROR: TRANSMISSION BLOCKED\n*They* control the network.';
            }
            document.getElementById(thinkingId).querySelector('.text-bubble').innerText = errorMsg;
        }
        
        // Re-enable inputs
        inputField.disabled = false;
        sendBtn.disabled = false;
        buttons.forEach(btn => btn.disabled = false);
        inputField.focus();
        outputArea.scrollTop = outputArea.scrollHeight;
    };

    window.handleInput = function() {
        const input = document.getElementById('userInput');
        if(input.value.trim() !== "") {
            window.askAI(input.value);
            input.value = '';
        }
    };
</script>

</body>
</html>
