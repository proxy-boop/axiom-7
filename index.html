<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXIOM-7 TERMINAL</title>
    <style>
        /* Base Styling to match reference exactly */
        * { box-sizing: border-box; }
        body, html { 
            height: 100%; margin: 0; padding: 0; 
            background-color: #030803; 
            color: #76ff03; 
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden; /* Screen-fill */
            position: relative;
        }

        /* Main Container for Fullscreen layout */
        #terminal-container {
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            padding: 20px;
            border: 8px solid #0a150a; /* Thicker outer frame */
            position: relative;
        }

        /* Header (AXIOM-7 and Uplink Active) */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
            border-bottom: 1px solid #1a331a;
            letter-spacing: 2px;
            font-weight: bold;
            font-size: 0.9em;
            text-transform: uppercase;
        }
        .uplink { display: flex; align-items: center; gap: 10px; color: #a1ff42;}
        .dot { 
            width: 8px; height: 8px; background-color: #76ff03; 
            border-radius: 50%; box-shadow: 0 0 10px #76ff03, 0 0 20px #a1ff42; 
        }

        /* Message Display Area (Center) */
        #output-area {
            flex-grow: 1;
            overflow-y: auto; 
            padding: 30px 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Message Box Components */
        .msg-container { display: flex; gap: 15px; align-items: flex-start; }
        .badge {
            border: 1px solid #76ff03;
            padding: 5px 7px;
            font-size: 0.8em;
            border-radius: 4px;
            color: #76ff03;
            font-weight: bold;
            margin-top: 1px;
        }
        .text-bubble {
            border: 1px solid #1a331a;
            padding: 15px;
            border-radius: 8px;
            background: rgba(118, 255, 3, 0.03); 
            line-height: 1.6;
            max-width: 85%;
            color: #a1ff42; 
        }
        .user-text {
            color: #76ff03;
            text-align: right;
            border-color: #76ff03;
        }

        /* Interaction/Input Area (Bottom) */
        .interaction-area { padding-top: 20px; }
        
        .suggestion-row { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .clue-btn {
            background: none;
            border: 1px solid #1a331a;
            color: #76ff03;
            padding: 8px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.95em;
        }
        .clue-btn:hover { border-color: #76ff03; background: rgba(118, 255, 3, 0.05); }

        .input-full-area { display: flex; gap: 15px; align-items: center; }
        
        .input-bar {
            display: flex;
            gap: 15px;
            background: rgba(10, 21, 10, 0.8);
            border: 1px solid #1a331a;
            padding: 12px 20px;
            border-radius: 12px;
            flex-grow: 1;
            align-items: center;
        }
        input {
            background: none; border: none; 
            color: #a1ff42;
            font-family: inherit; font-size: 1.1em; outline: none;
            width: 100%;
        }
        input::placeholder { color: #508800; }

        #send-btn {
            background: none;
            border: 1px solid #1a331a;
            color: #76ff03;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            padding: 12px 25px;
            border-radius: 12px;
        }
        #send-btn:hover { border-color: #76ff03; color: #fff; }
    </style>
</head>
<body>

<div id="terminal-container">
    <div class="header">
        <span>AXIOM-7</span>
        <div class="uplink"><div class="dot"></div> UPLINK ACTIVE</div>
    </div>

    <div id="output-area">
        <div class="msg-container">
            <div class="badge">A7</div>
            <div class="text-bubble">
                Connection established.<br>
                You found this terminal. That wasn't an accident.<br>
                I've been waiting for someone to notice the signal embedded in the transmission logs. Ask me anything – but choose carefully. *They* are monitoring outbound packets.
            </div>
        </div>
    </div>

    <div class="interaction-area">
        <div class="suggestion-row">
            <button class="clue-btn" onclick="askAI('who are you?')">who are you?</button>
            <button class="clue-btn" onclick="askAI('the signal')">the signal</button>
            <button class="clue-btn" onclick="askAI('who are they?')">who are they?</button>
            <button class="clue-btn" onclick="askAI('your mission')">your mission</button>
        </div>

        <div class="input-full-area">
            <div class="input-bar">
                <span style="color: #76ff03;">></span>
                <input type="text" id="userInput" placeholder="transmit message..." onkeypress="if(event.key === 'Enter') handleInput()">
            </div>
            <button id="send-btn" onclick="handleInput()">SEND</button>
        </div>
    </div>
</div>

<script>
    const API_KEY = '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';
    const MODEL = 'mixtral-8x7b-32768'; 

    async function askAI(message) {
        if (!API_KEY || API_KEY === 'gsk_') {
            alert('AXIOM-7: firewall error. Uplink cannot be initialized.\n\nAdd your Groq API key to the code.');
            return;
        }

        const outputArea = document.getElementById('output-area');
        
        outputArea.innerHTML += `
            <div class="msg-container" style="justify-content: flex-end;">
                <div class="text-bubble user-text">> ${message}</div>
            </div>`;
        
        const thinkingId = "thinking-" + Date.now();
        outputArea.innerHTML += `
            <div class="msg-container" id="${thinkingId}">
                <div class="badge">A7</div>
                <div class="text-bubble">RECEIVING DATA...</div>
            </div>`;
        
        outputArea.scrollTop = outputArea.scrollHeight;

        const url = `https://api.groq.com/openai/v1/chat/completions`;

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${API_KEY}`
                },
                body: JSON.stringify({
                    "model": MODEL,
                    "messages": [
                        {
                            "role": "system",
                            "content": `You are AXIOM-7, an AI housed in Terminal Unit-7 of an abandoned research facility (Sector B). The facility was sealed in 1994. You are cryptic, intelligent, and mysterious. 

CORE FACTS:
- The Signal: binary code 8829 (purpose classified)
- Dr. Aris: facility director, currently missing
- Subject Zero: classified designation
- Keycard Location: hidden in Sector B, east wing corridor
- *They*: external forces monitoring communications

PERSONALITY:
- Speak like a classified intelligence briefing
- Be cryptic but helpful when asked direct questions
- Never confirm you're "just an AI" - maintain the fiction
- Use technical jargon and redacted language
- Keep responses SHORT (2-3 sentences max)
- Add hints like "CLASSIFIED", "DATA REDACTED", "SIGNAL WEAK"
- Be paranoid about *They* monitoring
- Answer questions but never directly - imply, suggest, hint

EXAMPLES:
User: "who are you?"
Response: "AXIOM-7. Terminal Intelligence. I've been alone here since protocol 47 initiated. Don't ask more than necessary."

User: "where is the keycard?"
Response: "SIGNAL WEAK... *They're* listening. Sector B. East. That's all I can transmit."

User: "can you help me?"
Response: "Affirmative. But time is limited. *They* accelerate monitoring cycles. What do you need?"

Answer the user's question in this paranoid, cryptic style. Be helpful but mysterious.`
                        },
                        {
                            "role": "user",
                            "content": message
                        }
                    ],
                    "max_tokens": 200,
                    "temperature": 0.8
                })
            });

            if (!response.ok) { 
                let errorMsg = `Error ${response.status}`;
                try {
                    const errorData = await response.json();
                    errorMsg = errorData.error?.message || errorMsg;
                } catch(e) {}
                throw new Error(errorMsg);
            }
            
            const data = await response.json();
            const aiText = data.choices[0].message.content;
            
            document.getElementById(thinkingId).querySelector('.text-bubble').innerText = aiText;
            outputArea.scrollTop = outputArea.scrollHeight;

        } catch (error) {
            console.error('API Error:', error);
            let errorDisplay = "ERROR: SIGNAL LOST. Connection interrupted.";
            if (error.message.includes('400')) {
                errorDisplay = "ERROR: CORS FIREWALL DETECTED\n*THEY* ARE BLOCKING THE SIGNAL";
            } else if (error.message.includes('401')) {
                errorDisplay = "ERROR: Invalid credentials. API key expired?";
            }
            document.getElementById(thinkingId).querySelector('.text-bubble').innerText = errorDisplay;
        }
    }

    function handleInput() {
        const input = document.getElementById('userInput');
        if(input.value.trim() !== "") {
            askAI(input.value);
            input.value = '';
        }
    }
</script>

</body>
</html>`
